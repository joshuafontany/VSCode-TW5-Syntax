name: test

on:
  push:
    branches: ['**']
    # A TAG RUNS THE WHOLE SUITE AGAIN, on purpose. The release job below attaches what the jobs
    # beside it proved IN THIS RUN, so a tag that never ran them can carry no release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  grammar:
    # The harness resolves the VS Code grammar root per platform, and a runner carries
    # none of the grammars VS Code bundles. Running three platforms proves both.
    #
    # ONE NODE, BECAUSE THE PATTERN STANDS DECLARED. `every-test-runs.test.js` rules that a runner
    # script carry its test pattern as a QUOTED glob, so a file standing where the glob cannot see
    # it fails where a reader meets it rather than never running. A quoted pattern reaches Node
    # unexpanded, and Node 20 cannot expand one — it answers `Could not find`. Nothing here promises
    # a Node version: `engines` names only VS Code, and the claim this matrix makes is PLATFORM
    # resolution, which three operating systems carry on their own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    name: grammar (${{ matrix.os }}, node ${{ matrix.node }})
    defaults:
      run:
        shell: bash
    steps:
      # FULL HISTORY, NOT A SHALLOW CUT. Several invariants are red-first against the real parent:
      # they `git show` the commit a cure retires and the tag the published version carries. A
      # depth-1 checkout answers `fatal: invalid object name`, which reads as a grammar fault and
      # is not one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: TiddlyWiki5 grammar
        run: npm test

      - name: Memetic-Wikitext grammar
        run: npm run tests-memetic

      # Each sample's whole tokenization, pinned beside it. A change to any construct a
      # sample carries surfaces here, naming the file, the line and both readings.
      - name: Snapshots
        run: npm run snap

      # A run that opens and never closes colours to the end of the file. The canary
      # appends an ordinary sentence to every sample and asserts it stays plain.
      - name: Bleed canary
        run: npm run canary

      # The memetic grammar stands at zero findings and holds there; see contributing.md.
      - name: Terminator closure
        run: npm run lint-closure

      # Broad ground, gated on invariants: every declared scope reached, and nothing
      # colouring the sentence after it.
      - name: Corpus
        run: npm run corpus

      # The deciding half of tools/upstream-coverage.js, against snapshots whose answer
      # it states rather than infers.
      - name: Tool tests
        run: npm run test-tools
      # A TEST WRITING OUTSIDE A SANDBOX MAKES EVERY CONCURRENT READER FLAKY. One provocation wrote a
      # tracked harvest in place and restored it in a `finally`, leaving a window the whole suite ran
      # inside — a gate reading it at the wrong moment failed for a fault nobody had. The suite must
      # leave the tree exactly as it found it, and a heuristic over source cannot prove that where
      # running it can.
      - name: The suite leaves the working tree as it found it
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "a test wrote outside a sandbox and left the tree dirty:"; echo "$dirty"; exit 1
          fi

  gates:
    # Every witness the manifest names, run where it can answer. A gate nobody runs measures
    # nothing, and CI once reached six of twenty-two while the rest stood green in a developer's
    # terminal and nowhere else. tools/ci-runs-the-gates.test.js holds this list to the manifest.
    #
    # THIS JOB NAMED THIRTY-FOUR OF THE MANIFEST'S GATES BY HAND, one npm-run step each — the same
    # thirty-four `tools/gate-report.js --check` already runs, in one process, reusing one TiddlyWiki
    # boot where its own tools share one. A gate the manifest grows joined this list only when
    # someone remembered to add a step for it; the report never forgets one, because it derives the
    # list from the manifest rather than carrying a copy of it. So one step replaces thirty-four.
    #
    # This step also runs every OTHER gate the report's manifest names — fifteen the codebase
    # already exercises elsewhere (canary/snap/compose-wikitext/corpus in the `grammar` and
    # `compose` jobs) or under DIFFERENT terms (`signals`, `overreach-host`, `overreach-cut`
    # continue-on-error in `gates-host`; `upstream-coverage` against a fresh clone in `upstream`).
    # Running them again here, against the pinned devDependency, is not redundant in the way it
    # looks: it makes those four checks BLOCKING for the first time, where before only their
    # continue-on-error copies ran. That is a real strengthening of what CI enforces, not a
    # side-effect to wave through — see the commit message for the operator's call on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Every gate the manifest names
        run: node tools/gate-report.js --check

      # A gap the grammar grew to meet wants moving out of tests/known-gaps. Not a gate the
      # manifest names — tools/gate-report.js's own SKIP pattern excludes it on purpose.
      - name: Known gaps
        run: npm run tests-known-gaps

      # The edition's modules ship compiled. A compiler stands in this repository's own dependencies,
      # pinned, so this rebuilds them and asks whether the tree carries what the build writes. Not a
      # gate either, for the same reason.
      - name: The compiled edition stands current
        run: npm run edition

  gates-host:
    # Gates whose answer moves with the TiddlyWiki they read. The harvest names a version, and the
    # overreach runs take the grammar to the host's own tiddlers. TW5_PATH stands unset here, so
    # this resolves the pinned `tiddlywiki` devDependency `npm ci` already installed — the last
    # pinned release, never an unpinned clone of upstream master (the operator's ruling: local
    # development answers to this repository's own fork on TW5_PATH, and CI answers to the pinned
    # release). tools/reader-scope.js keys every ledger entry these gates read on the reader that
    # actually booted, so a ruling scoped to one reader neither fails nor reads stale under the
    # other.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The harvest matches the TiddlyWiki this reads
        run: npm run signals
      - name: The grammar against the host's own tiddlers
        run: npm run overreach-host
      - name: The same, cut mid-keystroke
        run: npm run overreach-cut

  package:
    # The package a user installs, so .vscodeignore and the manifest meet a build.
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every path the manifest names must stand inside the package. The source tree
      # resolves a file the package excludes; only the built .vsix answers this.
      - name: The package carries what the manifest names
        run: npm run package-contents
      # THE NAME CARRIES THE VERSION, because this file becomes a release asset and a reader
      # downloading `tw5-syntax.vsix` cannot tell which version they hold.
      - name: Build the package a user installs
        run: |
          version=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --allow-missing-repository --out "/tmp/tw5-syntax-$version.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: /tmp/tw5-syntax-*.vsix

  upstream:
    # TiddlyWiki's own rule regexes, taken to TiddlyWiki's own tiddlers, asking whether
    # this grammar reads each construct they match. It answers to upstream rather than to
    # this repository, so it runs beside the matrix and reports rather than blocks.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch TiddlyWiki5
        run: git clone --depth 1 https://github.com/TiddlyWiki/TiddlyWiki5.git /tmp/tw5
      - name: Coverage against upstream
        run: npm run upstream-coverage -- /tmp/tw5 6

  release:
    # A RELEASE IS A TAG THAT PASSED.
    #
    # Everything attached here was proven in THIS run by the jobs this one needs, and the .vsix is
    # the one `package` built — downloaded, never rebuilt — so the bytes a user installs are the
    # bytes CI measured rather than a second build that merely ought to match. `upstream` stands
    # outside the list: it answers to TiddlyWiki's tree rather than this one and reports instead of
    # blocking, so needing it would hand an unrelated repository a veto over this release.
    #
    # 3.0.0 was cut by hand from exactly this artifact. This job is that walk, written down.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [grammar, gates, gates-host, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # A PINNED NODE, because this job reads a version with it and every other job here pins one.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # THE TAG AND THE MANIFEST NAME ONE VERSION, asserted rather than assumed. Without this a
      # `v3.0.1` tag ships a 3.0.0 manifest and the Marketplace takes it, because nothing downstream
      # reads the tag at all.
      - name: The tag and the manifest name one version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          echo "the tag names $tag; the manifest names $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::the tag names $tag and the manifest names $manifest — a release cannot say which is wrong"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          name: vsix
          path: artifact

      # AND THE PACKAGE AGREES WITH BOTH. The artifact is built by a job that reads the manifest at
      # its own checkout; this reads the version INSIDE the file about to be published, so a stale
      # or mismatched artifact cannot reach a user under a version it does not carry.
      - name: The package carries the version the tag names
        run: |
          vsix=$(ls artifact/tw5-syntax-*.vsix)
          echo "attaching $vsix"
          unzip -p "$vsix" extension/package.json > /tmp/packaged.json
          packaged=$(node -p "require('/tmp/packaged.json').version")
          if [ "$packaged" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::the package carries $packaged where the tag names ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "vsix=$vsix" >> "$GITHUB_ENV"

      # A RE-PUSHED TAG UPDATES ITS RELEASE RATHER THAN FAILING ON ONE THAT STANDS. Cutting 3.0.0
      # moved its tag three times before the tree was right, and a job that refuses the second push
      # makes that walk impossible.
      - name: The release carries the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$vsix" --clobber
            echo "the release stood already; its asset now carries this run's build"
          else
            repo="${{ github.repository }}"
            {
              echo "See [CHANGELOG.md](https://github.com/$repo/blob/$GITHUB_REF_NAME/CHANGELOG.md) for what moved, and [MIGRATION.md](https://github.com/$repo/blob/$GITHUB_REF_NAME/MIGRATION.md) if you maintain a theme."
              echo
              echo "The attached \`.vsix\` is the artifact this run built and verified, not a second build that merely ought to match."
            } > /tmp/notes.md
            gh release create "$GITHUB_REF_NAME" "$vsix" \
              --title "${{ steps.version.outputs.version }}" \
              --verify-tag \
              --notes-file /tmp/notes.md
          fi

  marketplace:
    # THE ONE STEP NOTHING CAN TAKE BACK.
    #
    # A GitHub release can be deleted and a tag reseated; a Marketplace version cannot be unpublished
    # into never having existed. So this does not fire on a tag push alone. It waits on the
    # `marketplace` ENVIRONMENT, where a required reviewer makes the publish a decision somebody
    # makes, and it runs at all only once `MARKETPLACE_PUBLISH` stands `true` as a repository
    # variable — a secret cannot be read in an `if`, and a job referencing an absent secret fails
    # rather than standing aside.
    #
    # Until both stand, 3.0.x publishes the way 3.0.0 did: the operator runs `vsce publish
    # --packagePath` against the release asset, and the token never leaves their machine.
    if: startsWith(github.ref, 'refs/tags/v') && vars.MARKETPLACE_PUBLISH == 'true'
    needs: release
    environment: marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vsix
          path: artifact
      - name: Publish the package this run built
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix=$(ls artifact/tw5-syntax-*.vsix)
          npx --yes @vscode/vsce publish --packagePath "$vsix"

  changelog:
    # A change a user can see reaches the changelog in the commit that makes it. The one
    # entry that went missing surfaced only when someone asked for a version bump.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A user-visible change carries a changelog entry
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          visible=$(echo "$changed" | grep -E '^(syntaxes/|snippets/|package\.json$|.*language-configuration\.json$)' || true)
          if [ -z "$visible" ]; then
            echo "No user-visible surface changed."
            exit 0
          fi
          echo "Changed, and visible to a user:"
          echo "$visible" | sed 's/^/  /'
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md moves with it."
            exit 0
          fi
          echo "::error::A grammar, snippet, manifest or language configuration changed and CHANGELOG.md did not."
          exit 1
