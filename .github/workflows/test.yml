name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A runner carries none of the grammars VS Code bundles. run_tests.sh loads what
      # resolves and reports the rest; tm-grammars supplies the same text.html.basic.
      - name: TiddlyWiki5 grammar
        run: npm test

      - name: Memetic-Wikitext grammar
        run: npm run tests-memetic

      # The memetic grammar stands at zero findings and holds there; see contributing.md.
      - name: Terminator closure
        run: npm run lint-closure

      # The package a user installs, so .vscodeignore and the manifest meet a build.
      - name: Package
        run: npx --yes @vscode/vsce package --allow-missing-repository --out /tmp/tw5-syntax.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: /tmp/tw5-syntax.vsix
