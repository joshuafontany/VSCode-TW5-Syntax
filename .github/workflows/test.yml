name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  grammar:
    # The harness resolves the VS Code grammar root per platform, and a runner carries
    # none of the grammars VS Code bundles. Running three platforms proves both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    name: grammar (${{ matrix.os }}, node ${{ matrix.node }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: TiddlyWiki5 grammar
        run: npm test

      - name: Memetic-Wikitext grammar
        run: npm run tests-memetic

      # Each sample's whole tokenization, pinned beside it. A change to any construct a
      # sample carries surfaces here, naming the file, the line and both readings.
      - name: Snapshots
        run: npm run snap

      # A run that opens and never closes colours to the end of the file. The canary
      # appends an ordinary sentence to every sample and asserts it stays plain.
      - name: Bleed canary
        run: npm run canary

      # The memetic grammar stands at zero findings and holds there; see contributing.md.
      - name: Terminator closure
        run: npm run lint-closure

      # Broad ground, gated on invariants: every declared scope reached, and nothing
      # colouring the sentence after it.
      - name: Corpus
        run: npm run corpus

      # The deciding half of tools/upstream-coverage.js, against snapshots whose answer
      # it states rather than infers.
      - name: Tool tests
        run: npm run test-tools

  gates:
    # Every witness the manifest names, run where it can answer. A gate nobody runs measures
    # nothing, and CI reached six of twenty-two while the rest stood green in a developer's
    # terminal and nowhere else. tools/ci-runs-the-gates.test.js holds this list to the manifest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The guard the grammar does not adopt, measured against every tag in TiddlyWiki's tiddlers.
      - name: Attribute guard
        run: npm run attribute-guard

      # A pattern a reader would feel stall, taken to unfinished input at growing sizes.
      - name: Backtrack witness
        run: npm run backtrack-witness

      # The names TiddlyWiki's core owns, held to the judgement in the wiki.
      - name: Built-in variables
        run: npm run builtins

      # Distinctions a reader needs, and the themes that paint them apart.
      - name: Colour witness
        run: npm run colour-witness

      # Every scope innermost on a construct, against sixty-five themes.
      - name: Dark constructs
        run: npm run dark-construct

      # A construct nested in a container still reads as itself.
      - name: Nesting coverage
        run: npm run nesting-coverage

      # Every wikitext rule the host stands, the grammar reads.
      - name: Rule coverage
        run: npm run rule-coverage

      # An opener that never closes, bounded where the parser bounds it.
      - name: Swallow witness
        run: npm run swallow-witness

      # What a theme paints for this grammar against six comparator grammars.
      - name: Theme parity
        run: npm run theme-parity

      # The dialect's own composition, and its corpus against the parser.
      - name: Memetic composition
        run: npm run compose-memetic
      - name: Memetic corpus against the parser
        run: npm run overreach-corpus-memetic

      # A gap the grammar grew to meet wants moving out of tests/known-gaps.
      - name: Known gaps
        run: npm run tests-known-gaps

  gates-host:
    # Gates whose answer moves with the TiddlyWiki they read. The harvest names a version, and the
    # overreach runs take the grammar to the host's own tiddlers — so upstream moving reports here
    # rather than blocking a merge, the way the coverage job already does.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch TiddlyWiki5
        run: git clone --depth 1 https://github.com/TiddlyWiki/TiddlyWiki5.git /tmp/tw5
      - name: The harvest matches the TiddlyWiki this reads
        run: npm run signals:check
        env:
          TW5_PATH: /tmp/tw5
      - name: The grammar against the host's own tiddlers
        run: npm run overreach-host
        env:
          TW5_PATH: /tmp/tw5
      - name: The same, cut mid-keystroke
        run: npm run overreach-cut
        env:
          TW5_PATH: /tmp/tw5

  package:
    # The package a user installs, so .vscodeignore and the manifest meet a build.
    needs: grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every path the manifest names must stand inside the package. The source tree
      # resolves a file the package excludes; only the built .vsix answers this.
      - name: The package carries what the manifest names
        run: npm run package-contents
      - run: npx --yes @vscode/vsce package --allow-missing-repository --out /tmp/tw5-syntax.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: /tmp/tw5-syntax.vsix

  compose:
    # Does a sample still read the same way with another sample in front of it? A
    # construct reaching past its own file shows up here as the next file reading
    # differently — the one direction no other gate looks in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compose

  upstream:
    # TiddlyWiki's own rule regexes, taken to TiddlyWiki's own tiddlers, asking whether
    # this grammar reads each construct they match. It answers to upstream rather than to
    # this repository, so it runs beside the matrix and reports rather than blocks.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch TiddlyWiki5
        run: git clone --depth 1 https://github.com/TiddlyWiki/TiddlyWiki5.git /tmp/tw5
      - name: Coverage against upstream
        run: npm run upstream-coverage -- /tmp/tw5 6

  changelog:
    # A change a user can see reaches the changelog in the commit that makes it. The one
    # entry that went missing surfaced only when someone asked for a version bump.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A user-visible change carries a changelog entry
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          visible=$(echo "$changed" | grep -E '^(syntaxes/|snippets/|package\.json$|.*language-configuration\.json$)' || true)
          if [ -z "$visible" ]; then
            echo "No user-visible surface changed."
            exit 0
          fi
          echo "Changed, and visible to a user:"
          echo "$visible" | sed 's/^/  /'
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md moves with it."
            exit 0
          fi
          echo "::error::A grammar, snippet, manifest or language configuration changed and CHANGELOG.md did not."
          exit 1
